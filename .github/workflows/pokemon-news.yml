name: Actualites Pokemon KKS

on:
  workflow_dispatch:
  schedule:
    - cron: "15 7 * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install requests beautifulsoup4

      - name: Recuperer les actualites
        run: python pokemon_news.py

      - name: Enregistrer les actualites
        run: |
          git config user.name "KKS News Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pokemon_news.json
          if ! git diff --cached --quiet; then
            git commit -m "Mise a jour des actualites Pokemon"
            git push
          fi
